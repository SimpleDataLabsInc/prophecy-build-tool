# This workflow installs dependencies, lints, and runs tests across lanes.
# See test/README.md for the lane philosophy (fast vs legacy vs E2E).
# Docs on actions used: https://docs.github.com/en/actions

name: Python package

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Nightly E2E lane on main. Fast lanes run on every PR.
    - cron: "0 7 * * *"

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  # Keep Rich output stable for any residual stdout assertions.
  NO_COLOR: "1"
  COLUMNS: "200"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Black
        run: |
          python -m pip install --upgrade pip
          pip install black~=24.10
          black --check src/ test/

  # Fast lane: unit + integration across the Python matrix on Ubuntu.
  # Excludes the `e2e` / `spark` / `maven` markers so PRs stay quick.
  fast:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Maven / Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2
          key: ${{ runner.os }}-maven-ivy-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-maven-ivy-
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build + install
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          pip install "./dist/$(ls ./dist/ | grep whl)[test]"
      # Per-worker Maven local repo so parallel xdist workers do not race on ~/.m2.
      - name: Fast tests (unit + integration + v2; excludes e2e/spark/maven)
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/m2-${{ matrix.python-version }}
        run: |
          python -m pytest \
            -m "not e2e and not spark and not maven" \
            --timeout=300 \
            --cov=src/pbt --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=0 \
            -n auto \
            -v
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Legacy parity lane: runs the pre-refactor tests in a separate job so
  # any flakiness there is visible but does not gate the v2 signal.
  # Legacy tests use module-level env mutation, so this lane runs serially.
  legacy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Legacy tests (serial)
        run: python -m pytest -m legacy --timeout=600 -v

  # Cross-OS v2 lane (macOS + Windows). v2 tests avoid Maven/Spark and
  # should run anywhere Python and JDK are installed.
  v2-cross-os:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: v2 tests
        run: python -m pytest test/v2/ --timeout=300 -v

  # E2E lane: runs the full suite including legacy + spark/maven tests.
  # Runs on pushes to main and on the nightly cron only (never on PRs).
  e2e:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [fast, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Maven / Ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2
          key: ${{ runner.os }}-maven-ivy-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-maven-ivy-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Full suite
        run: python -m pytest --timeout=1200 -v
