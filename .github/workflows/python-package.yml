# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  pull_request:
    branches: [ "main" ]

env:
  # Service-principal (OAuth M2M) auth to the Databricks workspace. PBT resolves
  # these into a short-lived bearer token via the databricks-sdk credential chain.
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Install package
      run: |
        pip install "./dist/$(ls ./dist/ | grep whl)[test]"
    - name: Lint with Black
      run: |
        pip install black~=24.10
        # stop the build if there are Python syntax errors or undefined names
        black --check src/ test/
    - name: Test with pytest
      run: |
        python -m pytest test/test_* -v
