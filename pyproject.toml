[build-system]
requires = ["uv_build>=0.4"]
build-backend = "uv_build"

[project]
name = "prophecy-build-tool"
version = "1.5.0"
description = "Prophecy-build-tool (PBT) provides utilities to build and distribute projects created from the Prophecy IDE."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Prophecy", email = "maciej@prophecy.io" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9,<3.15"
dependencies = [
    "click>=8.1,<9",
    "requests>=2.28,<3",
    "PyYAML>=6.0,<7",
    "databricks-cli>=0.17.7,<=0.18.0",
    "databricks-sdk>=0.20,<1",
    "rich>=12.5.1,<15",
    "wheel>=0.41.3,<1",
    "build<2",
    "google-cloud-secret-manager>=2.22,<3",
    "google-cloud-storage>=2.10,<3",
    "pydantic>=1.10,<2",
    "pydantic-yaml>=1.4,<2",
    "boto3>=1.34.120,<2",
    "botocore>=1.34.120,<2",
    "tenacity>=8.2,<9",
    "gitpython>=3,<4",
    "semver<4",
    "twine<7",
    "jaraco.functools<=4.1.0",
    "packaging>=24.1,<25",
    "setuptools>=75.3.2,<81",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-html",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "pyspark>=3.3.0,<4.3",
    "parameterized",
    "uv",
]

[project.urls]
Homepage = "https://github.com/SimpleDataLabsInc/prophecy-build-tool"
"Bug Tracker" = "https://github.com/SimpleDataLabsInc/prophecy-build-tool/issues"

[project.scripts]
pbt = "pbt:main"

[tool.uv.build-backend]
module-name = "pbt"

[dependency-groups]
dev = [
    "black>=25.9,<26",
    "pycodestyle==2.10.0",
    "prophecy-build-tool[test]",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
extend-exclude = '''
(
  .*_pb2.py
  | test/resources/*
)
'''
