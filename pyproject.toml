[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prophecy-build-tool"
version = "1.4.2"
description = "Prophecy-build-tool (PBT) provides utilities to build and distribute projects created from the Prophecy IDE."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Prophecy", email = "maciej@prophecy.io" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "requests>=2.28,<3",
    "PyYAML>=6.0,<7",
    "databricks-cli>=0.17.7,<=0.18.0",
    "rich>=12.5.1,<15",
    "wheel>=0.41.3,<1",
    "build<2",
    "google-cloud-secret-manager>=2.22,<3",
    "google-cloud-storage>=2.10,<3",
    "pydantic>=1.10,<2",
    "pydantic-yaml>=1.4,<2",
    "boto3>=1.34.120,<2",
    "botocore>=1.34.120,<2",
    "tenacity>=8.2,<9",
    "gitpython>=3,<4",
    "semver<4",
    "twine<7",
    "jaraco.functools<=4.1.0",
    "setuptools>=75.3.2,<81",
]

[project.optional-dependencies]
test = [
    "pytest-html",
    "pytest-cov",
    "pytest",
    "pyspark>=3.3.0,<4.3",
    "mock",
    "parameterized",
]

[project.urls]
Homepage = "https://github.com/SimpleDataLabsInc/prophecy-build-tool"
"Bug Tracker" = "https://github.com/SimpleDataLabsInc/prophecy-build-tool/issues"

[project.scripts]
pbt = "pbt:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pbt"]

[tool.uv]
dev-dependencies = [
    "click>=8.1.3",
    "black~=24.10",
    "pycodestyle==2.10.0",
    "pytest",
    "pytest-html",
    "pytest-click",
    "pytest-cov",
    "pyspark~=3.3",
    "parameterized~=0.9.0",
    "packaging~=24.1",
]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
(
  .*_pb2.py
  | test/resources/*
)
'''
