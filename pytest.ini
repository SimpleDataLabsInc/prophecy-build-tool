[pytest]
minversion = 7.0
testpaths = test
python_files = test_*.py
norecursedirs = test/resources .git .tox build dist *.egg-info
addopts = -ra --strict-markers --color=yes --durations=25
markers =
    unit: pure unit tests; no Maven/Spark/network; safe under xdist.
    integration: touches filesystem and PBTCli but external tools are mocked.
    e2e: full-stack tests that run Maven/Spark/pytest/Databricks; reserved for a slow lane.
    spark: subset of e2e that invokes Spark locally (may be OOM-prone on CI workers).
    maven: subset of e2e that invokes Maven (downloads, compiles).
    legacy: pre-refactor tests kept as a parity baseline. See test/README.md.
    serial: tests that must run sequentially (e.g. mutate shared state); excluded from xdist parallel lane.
    v2: exercises the v2 CLIs (build_v2, test_v2, deploy_v2, validate_v2) or the PBTCli/v2 project model.
    fast: fast v2 tests (unit/integration); safe under xdist and runs on every PR.
filterwarnings =
    ignore::DeprecationWarning
